[package]
name = "orrery"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
description = "Orrery native original-game controller and comparison tooling for Astrolabe"

[dependencies]
astrolabe = { path = "../.." }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
axum = "0.8"
rmcp = { version = "3.4.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.14.0", features = ["xtest"] }
signal-hook = "0.4.4"
png = "0.18"

[dev-dependencies]
tempfile = "3.27"
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
