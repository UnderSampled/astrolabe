[package]
name = "godot-harness"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
description = "Independent Godot consumer of Astrolabe session recordings"

[dependencies]
astrolabe = { path = "../.." }
behavior-contract = { path = "../behavior-contract" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
session-recording = { path = "../session-recording" }
sha2 = "0.10"
tempfile = "3.25"
window-video = { path = "../window-video" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"
