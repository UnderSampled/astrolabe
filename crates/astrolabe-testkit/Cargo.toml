[package]
name = "astrolabe-testkit"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
description = "Optional native runtime and comparison tooling for Astrolabe"

[dependencies]
astrolabe = { path = "../.." }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
