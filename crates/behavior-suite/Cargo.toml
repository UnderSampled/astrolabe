[package]
name = "behavior-suite"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
description = "Cross-engine Hype behavior scenarios and comparison runner"

[dependencies]
behavior-contract = { path = "../behavior-contract" }
orrery = { path = "../orrery" }
godot-harness = { path = "../godot-harness" }
astrolabe = { path = "../.." }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
cucumber = "=0.23.0"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
